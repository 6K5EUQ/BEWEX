<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhoneCam Viewer</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="viewer-page">
    <header class="viewer-header">
      <h1>📺 PhoneCam Viewer</h1>
      <span id="connBadge" class="badge"><span class="dot"></span><span id="connText">서버 연결 중…</span></span>
      <span id="pinBadge" class="badge hidden" title="외부 기기에서 시청할 때 입력하는 PIN">시청 PIN: <b id="pinText" style="margin-left:4px; letter-spacing:2px; color:var(--accent);"></b></span>
      <div class="spacer"></div>
      <span id="addrLabel">휴대폰 접속 주소:</span>
      <span id="addr" class="addr">…</span>
      <button id="qrBtn" class="btn" style="padding:6px 14px; font-size:13px;">QR 보기</button>
      <button id="shareBtn" class="btn hidden" style="padding:6px 14px; font-size:13px;">🖥️ 화면 공유</button>
    </header>

    <main class="stage">
      <div id="emptyState" class="empty-state">
        <h2>휴대폰 카메라를 연결하세요</h2>
        <img id="qrImg" class="qr" alt="접속 QR 코드" />
        <div class="addr-big" id="addrBig">…</div>
        <select id="addrSelect" class="addr-select hidden" title="휴대폰이 접속할 주소 선택"></select>
        <div class="steps" id="steps">
          1️⃣ 휴대폰을 <b>이 컴퓨터와 같은 Wi-Fi</b>에 연결<br />
          2️⃣ 휴대폰 카메라로 위 QR 코드 스캔 (또는 주소 직접 입력)<br />
          3️⃣ 보안 경고가 나오면 <b>고급 → 이동(계속)</b> 선택<br />
          4️⃣ <b>[방송 시작]</b>을 누르고 카메라 권한 허용
        </div>
      </div>
      <div id="pinGate" class="empty-state hidden">
        <h2>🔒 시청 PIN 입력</h2>
        <p style="color:var(--muted); font-size:14px; margin:0;">데스크톱 앱 상단에 표시된 6자리 PIN을 입력하세요.</p>
        <div style="display:flex; gap:10px;">
          <input id="pinInput" class="pin-input" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000" />
          <button id="pinBtn" class="btn primary" style="padding:12px 22px;">시청</button>
        </div>
        <div id="pinMsg" style="color:var(--danger); font-size:13px; min-height:18px;"></div>
      </div>
      <div id="remoteEmpty" class="empty-state hidden">
        <h2>방송 대기 중</h2>
        <p style="color:var(--muted); font-size:14px;">PC에서 [🖥️ 화면 공유]를 켜거나 휴대폰 카메라 방송을 시작하면 여기에 표시됩니다.</p>
      </div>
      <div id="grid" class="grid"></div>
    </main>
  </div>

  <script src="/viewer.js"></script>
</body>
</html>
