<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BEWE Mission Monitor</title>
  <link rel="stylesheet" href="monitor.css" />
</head>
<body>
  <div id="reconnectBanner" class="hidden">RECONNECTING</div>

  <main id="layoutRoot" class="layout-main">
    <section class="feed-panel" id="slot1" data-slot="1">
      <video class="feed-video hidden" autoplay playsinline muted></video>
      <img class="feed-frame hidden" alt="" />
      <div class="acquiring hidden">
        <span class="acquiring-text">ACQUIRING SIGNAL</span>
      </div>
      <div class="nosignal">
        <span class="nosignal-text">NO SIGNAL</span>
        <span class="nosignal-slot">CAM 1</span>
      </div>
      <header class="feed-head">
        <span class="feed-status off"><span class="dot"></span><span class="feed-status-text">NO SIGNAL</span></span>
        <span class="feed-name">CAM 1</span>
        <span class="feed-mode"></span>
      </header>
      <footer class="feed-foot">
        <span class="feed-stats"></span>
        <span class="spacer"></span>
        <button class="feed-mute hidden" title="소리 켜기/끄기">MUTED</button>
      </footer>
    </section>

    <section class="feed-panel" id="slot2" data-slot="2">
      <video class="feed-video hidden" autoplay playsinline muted></video>
      <img class="feed-frame hidden" alt="" />
      <div class="acquiring hidden">
        <span class="acquiring-text">ACQUIRING SIGNAL</span>
      </div>
      <div class="nosignal">
        <span class="nosignal-text">NO SIGNAL</span>
        <span class="nosignal-slot">CAM 2</span>
      </div>
      <header class="feed-head">
        <span class="feed-status off"><span class="dot"></span><span class="feed-status-text">NO SIGNAL</span></span>
        <span class="feed-name">CAM 2</span>
        <span class="feed-mode"></span>
      </header>
      <footer class="feed-foot">
        <span class="feed-stats"></span>
        <span class="spacer"></span>
        <button class="feed-mute hidden" title="소리 켜기/끄기">MUTED</button>
      </footer>
    </section>

    <section class="feed-panel" id="slot3" data-slot="3">
      <video class="feed-video hidden" autoplay playsinline muted></video>
      <img class="feed-frame hidden" alt="" />
      <div class="acquiring hidden">
        <span class="acquiring-text">ACQUIRING SIGNAL</span>
      </div>
      <div class="nosignal">
        <span class="nosignal-text">NO SIGNAL</span>
        <span class="nosignal-slot">BEWE</span>
      </div>
      <header class="feed-head">
        <span class="feed-status off"><span class="dot"></span><span class="feed-status-text">NO SIGNAL</span></span>
        <span class="feed-name">BEWE</span>
        <span class="feed-mode"></span>
      </header>
      <footer class="feed-foot">
        <span class="feed-stats"></span>
        <span class="spacer"></span>
        <button class="feed-mute hidden" title="소리 켜기/끄기">MUTED</button>
      </footer>
    </section>
  </main>

  <footer id="statusBar">
    <span class="bar-side bar-left">
      <span id="unassignedText" class="warn-text"></span>
      <span class="bar-item">
        <span id="connBadge" class="badge"><span class="dot"></span></span>
        <span class="label">SERVER</span>
      </span>
    </span>
    <span class="bar-center">
      <span class="bar-item"><span class="label">UTC</span><span id="utcClock" class="value">--:--:--</span></span>
      <span class="sep"></span>
      <span class="bar-item">
        <span id="missionClock" title="클릭: 시작/일시정지 · 우클릭: 리셋">T+ 00:00:00</span>
      </span>
      <span class="sep"></span>
      <span class="bar-item"><span class="label">LOCAL</span><span id="localClock" class="value">--:--:--</span></span>
    </span>
    <span class="bar-side bar-right">
      <button id="layoutBtn" title="레이아웃 전환 (단축키 L)">LAYOUT: MAIN</button>
    </span>
  </footer>

  <script src="monitor.js" defer></script>
</body>
</html>
