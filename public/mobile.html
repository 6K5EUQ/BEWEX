<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <title>PhoneCam - 카메라 송출</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* 슬롯 지정 접속(?slot=N) 시 헤더에 붙는 CAM 태그 */
    .slot-tag {
      display: inline-block;
      vertical-align: middle;
      margin-left: 8px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      background: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="mobile-page">
    <header>
      <h1>카메라 송출<span id="slotTag" class="slot-tag hidden"></span></h1>
      <p>아래 버튼을 누르고 카메라 권한을 허용하면 데스크톱으로 실시간 전송됩니다.</p>
    </header>

    <div class="preview-wrap">
      <video id="preview" autoplay playsinline muted></video>
      <div id="previewOverlay" class="preview-overlay">
        <div class="cam-icon"></div>
        <div>아직 카메라가 꺼져 있습니다.<br />[방송 시작]을 눌러 주세요.</div>
      </div>
      <div class="status-bar">
        <span id="statusBadge" class="badge"><span class="dot"></span><span id="statusText">대기 중</span></span>
        <span id="modeBadge" class="badge hidden"><span class="dot"></span><span id="modeText"></span></span>
        <span id="slotBadge" class="badge hidden"><span class="dot"></span><span id="slotText"></span></span>
      </div>
    </div>

    <div class="controls">
      <div class="row">
        <input id="nameInput" type="text" maxlength="30" placeholder="카메라 이름 (예: 현관, 내 폰)" />
      </div>
      <label class="check"><input id="audioCheck" type="checkbox" /> 마이크 소리도 함께 보내기</label>
      <div class="row">
        <button id="startBtn" class="btn primary wide">방송 시작</button>
      </div>
      <div class="row hidden" id="liveControls">
        <button id="flipBtn" class="btn" style="flex:1">카메라 전환</button>
        <button id="stopBtn" class="btn danger" style="flex:1">방송 종료</button>
      </div>
    </div>

    <p class="hint">
      처음 접속 시 "연결이 비공개로 설정되어 있지 않습니다" 경고가 나올 수 있습니다.
      이 프로그램이 직접 만든 사설 인증서 때문이며, <b>고급 → 이동(계속)</b>을 누르면 됩니다.
      휴대폰과 데스크톱이 <b>같은 Wi-Fi</b> 또는 <b>같은 Tailscale 네트워크</b>에 연결되어 있어야 합니다.
    </p>
  </div>

  <script src="/mobile.js"></script>
</body>
</html>
